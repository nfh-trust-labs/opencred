name: CI

on:
  pull_request:
    branches: [new-opencred-dev, main]
  push:
    branches: [new-opencred-dev]

jobs:
  changelog-guard:
    name: CHANGELOG guard
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      - name: Fail if CHANGELOG.md edited by hand
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' | grep -qx "CHANGELOG.md"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is owned by release-please — remove manual edits (see CLAUDE.md / REVIEW.md)."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # vitest 2.x's forks pool (tinypool 1.x) has no watchdog on worker
    # startup: if the fork→ready IPC handshake is lost while recycling the
    # worker between test files — which we've observed intermittently on
    # 2-core runners — the run wedges forever with zero output. A healthy
    # run of this job completes in ~10 minutes; fail fast instead of
    # burning a runner for 6 h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
