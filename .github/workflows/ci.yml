name: CI

on:
  pull_request:
    branches: [new-opencred-dev, main]
  push:
    branches: [new-opencred-dev]

# A fixup push to a PR cancels the superseded in-flight run. Push runs on
# new-opencred-dev are never cancelled mid-flight (cancel-in-progress is
# false for them), but queued superseded ones are replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    # Gated on lint: it's the cheapest job (~1 min) and historically the
    # most common failure (47 of 58 runs in June 2026 were red, mostly
    # lint/format). Running the expensive jobs only after lint passes
    # trades ~1 min of latency on green runs for ~7 min saved on red ones.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    # vitest 2.x's forks pool (tinypool 1.x) has no watchdog on worker
    # startup: if the fork→ready IPC handshake is lost while recycling the
    # worker between test files — which we've observed intermittently on
    # 2-core runners — the run wedges forever with zero output. A healthy
    # run of this job completes in ~10 minutes; fail fast instead of
    # burning a runner for 6 h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
