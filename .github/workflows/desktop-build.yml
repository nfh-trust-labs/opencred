name: Desktop Build

on:
  push:
    branches: [anusree-dev]
  pull_request:
    branches: [anusree-dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter @opencred/desktop... build

      - name: Run tests
        run: pnpm --filter @opencred/desktop test

      # Smoke test -- build distributable without code signing.
      # Uses continue-on-error because platform-specific packaging
      # may fail in CI without signing certs, icons, etc.
      - name: Build distributable (smoke test)
        continue-on-error: true
        run: pnpm --filter @opencred/desktop exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
