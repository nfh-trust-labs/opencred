name: Desktop Build

on:
  push:
    branches: [anusree-dev]
  pull_request:
    branches: [anusree-dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter @opencred/desktop... build

      - name: Run tests
        run: pnpm --filter @opencred/desktop test

      # Smoke test -- build distributable without signing
      - name: Build distributable
        run: pnpm --filter @opencred/desktop exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
