name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — both architectures
          - os: macos-latest
            platform: mac
            arch: x64
            electron_builder_args: "--mac --x64"
            artifact_suffix: mac-x64
          - os: macos-latest
            platform: mac
            arch: arm64
            electron_builder_args: "--mac --arm64"
            artifact_suffix: mac-arm64
          # Linux — x64 only (no GitHub-hosted arm64 runners)
          - os: ubuntu-latest
            platform: linux
            arch: x64
            electron_builder_args: "--linux --x64"
            artifact_suffix: linux-x64
          # Windows — x64 only (no GitHub-hosted arm64 runners)
          - os: windows-latest
            platform: win
            arch: x64
            electron_builder_args: "--win --x64"
            artifact_suffix: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Python is required by node-gyp for native addon compilation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Linux needs additional packages for electron-builder (AppImage, deb)
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @opencred/desktop... build

      - name: Run tests
        run: pnpm --filter @opencred/desktop test

      # Flatten pnpm workspace symlinks so electron-builder can pack them
      - name: Flatten dependencies
        working-directory: apps/desktop
        run: node scripts/flatten-deps.cjs

      # Rebuild native addons (pkcs11js, macos-keychain, windows-cng) for the
      # Electron ABI on this platform. The binding.gyp conditionally compiles
      # only the platform-appropriate addon (macos-keychain on mac, windows-cng
      # on win, neither on linux).
      # Custom native addon rebuild (macos-keychain/windows-cng).
      # On Linux there are no custom targets so this is a no-op.
      # electron-builder also runs its own @electron/rebuild for pkcs11js.
      - name: Rebuild native addons for Electron
        run: pnpm --filter @opencred/desktop rebuild:native
        continue-on-error: true

      - name: Verify native addons
        run: node scripts/verify-native-addons.cjs
        continue-on-error: true
        working-directory: packages/signing

      - name: Build distributable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EB_ARGS: ${{ matrix.electron_builder_args }}
        shell: bash
        run: |
          pnpm --filter @opencred/desktop exec electron-builder $EB_ARGS --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencred-${{ matrix.artifact_suffix }}
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.msi
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
            apps/desktop/out/*.rpm
          if-no-files-found: warn
          retention-days: 30
