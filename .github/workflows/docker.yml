name: Docker

# ==============================================================================
# OpenCred — Docker CI/CD Pipeline
# ==============================================================================
# Builds, scans, and pushes the apps/server Docker image.
#
# - PRs: build + Trivy vulnerability scan (validates Dockerfile compiles)
# - Push to new-opencred-dev or opencred-prod: build + scan
# - v* tags: build + scan + push to GHCR + smoke test
# ==============================================================================

on:
  pull_request:
    branches: [new-opencred-dev, opencred-prod]
    paths:
      - "apps/server/Dockerfile"
      - "apps/server/src/**"
      - "apps/server/package.json"
      - "docker-compose.yml"
      - ".dockerignore"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"
  push:
    branches: [new-opencred-dev, opencred-prod]
    tags: ['v*']
    # Note: no paths filter on push — tags don't carry a changed-files diff,
    # so paths would prevent tag pushes from triggering. PRs still use paths.

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/opencred-server

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # Run tests before allowing push
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # --------------------------------------------------------------------------
  # Build and scan on every PR and push
  # --------------------------------------------------------------------------
  docker-build:
    name: Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: ${{ env.SERVER_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SERVER_IMAGE }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          scanners: vuln

  # --------------------------------------------------------------------------
  # Push to GHCR on v* tags
  # --------------------------------------------------------------------------
  docker-push:
    name: Push to GHCR
    needs: [docker-build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required for cross-arch builds — emulates arm64 on the amd64 runner.
      # Adds ~3-4 min to the build vs single-arch, but means Apple Silicon
      # users and AWS Graviton hosts can pull without `--platform` workarounds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' from tag (v1.2.3 -> 1.2.3)
          VERSION="${GIT_REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          # Multi-arch manifest list. Clients pull the variant matching
          # their CPU automatically — no `--platform` flag required.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  # --------------------------------------------------------------------------
  # Smoke test after push
  # --------------------------------------------------------------------------
  smoke-test:
    name: Smoke Test
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run container
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          set -e

          # The server requires both an API key and a signing key at
          # startup. Generate throwaway versions of each just for this
          # smoke test — they're discarded after the run.
          mkdir -p smoke-keys
          openssl genpkey -algorithm EC \
            -pkeyopt ec_paramgen_curve:P-256 \
            -out smoke-keys/key.pem
          # Mode 0644 — bind mount preserves host ownership (runner uid),
          # container runs as `node` (uid 1000); 0600 reads with EACCES
          # inside the container. Runner is ephemeral; throwaway file.
          chmod 644 smoke-keys/key.pem
          # Random API key — never echoed, never committed.
          API_KEY=$(openssl rand -base64 32)

          docker run -d --name opencred-smoke \
            -p 3100:3100 \
            -e OPENCRED_PORT=3100 \
            -e OPENCRED_API_KEY="$API_KEY" \
            -e OPENCRED_KEY_PATH=/secrets/key.pem \
            -e OPENCRED_LOG_LEVEL=info \
            -v "$(pwd)/smoke-keys/key.pem:/secrets/key.pem:ro" \
            --read-only \
            --tmpfs /tmp:noexec,nosuid,size=64m \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            "$SERVER_IMAGE:$IMAGE_TAG"

          # Poll /v1/health until the server is ready (typically <3s).
          # 30s upper bound — anything slower is a real regression.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/v1/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          HEALTH=$(curl -fsS http://localhost:3100/v1/health || true)
          echo "Health response: $HEALTH"

          # Smoke is "boots + loads key + ready to serve". Anything weaker
          # would have let v1.1.0 ship green when it had been broken; the
          # `signingKeyLoaded:true` check is what would have caught a bad
          # key-loading regression.
          if ! echo "$HEALTH" | grep -q '"signingKeyLoaded":true'; then
            echo "Smoke test failed — signingKeyLoaded is not true"
            docker logs opencred-smoke
            exit 1
          fi
          if ! echo "$HEALTH" | grep -q '"ready":true'; then
            echo "Smoke test failed — ready is not true"
            docker logs opencred-smoke
            exit 1
          fi

          echo "Smoke test passed"
          docker stop opencred-smoke
          docker rm opencred-smoke

      # Always remove the throwaway key, even if the smoke step above
      # failed. Runner is ephemeral but belt-and-braces — `if: always()`
      # handles the failure path.
      - name: Cleanup smoke-test key
        if: always()
        run: rm -rf smoke-keys
