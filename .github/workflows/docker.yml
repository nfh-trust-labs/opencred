name: Docker

# ==============================================================================
# OpenCred — Docker CI/CD Pipeline
# ==============================================================================
# Builds, scans, and pushes the apps/server Docker image.
#
# - PRs: build + Trivy vulnerability scan (validates Dockerfile compiles)
# - Push to new-opencred-dev or opencred-prod: build + scan
# - v* tags: build + scan + push to GHCR + smoke test
# ==============================================================================

on:
  pull_request:
    branches: [new-opencred-dev, opencred-prod]
    paths:
      - "apps/server/Dockerfile"
      - "apps/server/src/**"
      - "apps/server/package.json"
      - "docker-compose.yml"
      - ".dockerignore"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"
  push:
    branches: [new-opencred-dev, opencred-prod]
    tags: ['v*']
    # Note: no paths filter on push — tags don't carry a changed-files diff,
    # so paths would prevent tag pushes from triggering. PRs still use paths.

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/opencred-server

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # Run tests before allowing push
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # --------------------------------------------------------------------------
  # Build and scan on every PR and push
  # --------------------------------------------------------------------------
  docker-build:
    name: Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: ${{ env.SERVER_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SERVER_IMAGE }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          scanners: vuln

  # --------------------------------------------------------------------------
  # Push to GHCR on v* tags
  # --------------------------------------------------------------------------
  docker-push:
    name: Push to GHCR
    needs: [docker-build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' from tag (v1.2.3 -> 1.2.3)
          VERSION="${GIT_REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  # --------------------------------------------------------------------------
  # Smoke test after push
  # --------------------------------------------------------------------------
  smoke-test:
    name: Smoke Test
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run container
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name opencred-smoke \
            -p 3100:3100 \
            -e OPENCRED_LOG_LEVEL=info \
            "$SERVER_IMAGE:$IMAGE_TAG"

          # Wait for container to start
          sleep 5

          # Health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/health)
          echo "Health check returned: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Smoke test failed — /health returned $HTTP_CODE"
            docker logs opencred-smoke
            exit 1
          fi

          echo "Smoke test passed"
          docker stop opencred-smoke
          docker rm opencred-smoke
