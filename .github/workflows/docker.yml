name: Docker

# ==============================================================================
# OpenCred — Docker CI/CD Pipeline
# ==============================================================================
# Will be fully configured in Phase 7 (Containerization & Deployment).
# Builds, scans, and pushes the apps/server Docker image.
# ==============================================================================

on:
  pull_request:
    branches: [new-opencred-dev]
    paths:
      - "apps/server/Dockerfile"
      - "apps/server/src/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"
  push:
    branches: [new-opencred-dev]
    paths:
      - "apps/server/Dockerfile"
      - "apps/server/src/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/opencred-server

jobs:
  # Placeholder — Phase 7 will add:
  # - docker-build: Build + Trivy scan of apps/server image
  # - docker-push: Push to GHCR on merge to new-opencred-dev
  # - smoke-test: docker compose up -> /health -> issue -> verify -> tear down
  placeholder:
    name: Docker pipeline (Phase 7)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker pipeline will be configured in Phase 7"
