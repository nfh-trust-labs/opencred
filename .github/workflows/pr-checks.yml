name: PR Checks

# Repo-policy checks that run on every PR:
#  - branch-target guard: feature PRs must target opencred-dev, not main
#    (main only accepts the opencred-dev promotion PR and release-please PRs)
#  - DCO: every commit must carry a Signed-off-by line (git commit -s)

on:
  pull_request:
    branches: [main, opencred-dev]

permissions:
  contents: read

jobs:
  branch-target-guard:
    name: Branch target guard
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check that only promotion/release PRs target main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # Allowed onto main: the opencred-dev promotion PR and
          # release-please's own release PRs — both from branches in THIS
          # repo (never from a fork).
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            case "$HEAD_REF" in
              opencred-dev|release-please--*)
                echo "Promotion/release PR — allowed onto main."
                exit 0
                ;;
            esac
          fi
          echo "::error::PRs must target the 'opencred-dev' branch, not 'main'."
          echo "::error::'main' only accepts the opencred-dev promotion PR and release-please PRs."
          echo "::error::Please edit this PR's base branch to 'opencred-dev' (Edit button next to the PR title)."
          exit 1

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .*<.*@.*>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line."
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            echo "::error::All commits need a DCO sign-off. Amend with: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi
          echo "All commits carry a Signed-off-by line."
