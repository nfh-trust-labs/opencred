name: Release Please

# Releases are cut from `main`: the integration branch is promoted to main
# via a merge-commit PR, which triggers release-please here.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Chaining into docker.yml via workflow_call requires this: docker.yml
  # declares `packages: write` (GHCR push) at workflow level, and a called
  # workflow's permissions cannot exceed the caller's. Without it the run
  # dies at startup with `startup_failure` and zero jobs — the same symptom
  # that forced the #533 revert.
  packages: write

jobs:
  release-please:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # After a release lands on main, merge the version-bump/changelog commits
  # back into the integration branch so the next promotion PR doesn't
  # conflict on package.json / CHANGELOG.md.
  back-merge:
    name: Back-merge main into the integration branch
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-opencred-dev
          fetch-depth: 0
      - name: Merge main into the integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin new-opencred-dev

  # Trigger desktop release builds when a release is created
  # Pass the tag explicitly. This workflow runs on a push to `main`, so
  # inside the called workflow `github.ref_name` is "main", NOT the tag —
  # without this input the release job publishes to a bogus release named
  # `main` and marks it Latest (observed on v1.10.0). The called workflow
  # declares `tag` as an optional input precisely so this can be passed.
  desktop-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Docker publish is gated on `refs/tags/v*`, but GitHub suppresses
  # tag-push triggers for tags created with GITHUB_TOKEN (the anti-loop
  # rule in the NOTE below), so a release-please tag never triggers it.
  # Chaining it here with an explicit tag is what makes the image publish.
  docker-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # NOTE: The chained workflow_call into docker.yml + the `with: tag: ...`
  # input passing on desktop-release.yml were added in #533 to fix the
  # post-tag fan-out gap (GitHub's anti-loop rule suppresses tag-push
  # triggers on refs created via GITHUB_TOKEN). That change caused every
  # release-please run to fail at startup — see follow-up issue. Reverted
  # to the v1.3.0 known-good shape until the fan-out fix can be tested in
  # isolation. Recovery for now is the manual tag re-push we used for
  # v1.3.0: delete the release-please-created tag and re-push from local
  # git credentials.
