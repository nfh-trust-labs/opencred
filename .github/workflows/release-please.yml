name: Release Please

on:
  push:
    branches: [new-opencred-dev]

permissions:
  contents: write
  pull-requests: write
  # Needed because we chain into docker.yml via workflow_call, which
  # declares `packages: write` to push to GHCR. A called workflow's
  # permissions cannot exceed the caller's — without `packages: write`
  # here the chained reusable workflow fails GitHub's parse-time
  # validation with `startup_failure`.
  packages: write

jobs:
  release-please:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: new-opencred-dev

  # Trigger desktop release builds when a release is created.
  # The `tag` input is passed explicitly: github.ref_name resolves to
  # `new-opencred-dev` in a workflow_call context, not the new v* tag.
  desktop-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Trigger the Docker build/push pipeline when a release is created.
  # GitHub's anti-loop rule suppresses tag-push triggers on refs created
  # by GITHUB_TOKEN (which release-please uses), so we chain explicitly.
  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
