name: Release Please

# NOTE (repo transition): this trigger is written for the merged-repo
# branch model (releases cut from main). Until the public-repo import
# completes, pushes to the legacy integration branch no longer trigger
# release-please — releases are intentionally frozen until the import.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # After a release lands on main, merge the version-bump/changelog commits
  # back into opencred-dev so the next promotion PR doesn't conflict on
  # package.json / CHANGELOG.md.
  back-merge:
    name: Back-merge main into opencred-dev
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opencred-dev
          fetch-depth: 0
      - name: Merge main into opencred-dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin opencred-dev

  # Trigger desktop release builds when a release is created
  desktop-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit

  # NOTE: The chained workflow_call into docker.yml + the `with: tag: ...`
  # input passing on desktop-release.yml were added in #533 to fix the
  # post-tag fan-out gap (GitHub's anti-loop rule suppresses tag-push
  # triggers on refs created via GITHUB_TOKEN). That change caused every
  # release-please run to fail at startup — see follow-up issue. Reverted
  # to the v1.3.0 known-good shape until the fan-out fix can be tested in
  # isolation. Recovery for now is the manual tag re-push we used for
  # v1.3.0: delete the release-please-created tag and re-push from local
  # git credentials.
