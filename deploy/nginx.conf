# ==============================================================================
# OpenCred — Nginx Reverse Proxy Configuration
# ==============================================================================
# Place in front of the OpenCred server for TLS termination, security headers,
# request size limiting, and CORS enforcement.
#
# Usage with Docker Compose:
#   Uncomment the `nginx` service in docker-compose.yml.
#   Set OPENCRED_CORS_ORIGIN in your .env file.
#
# Usage standalone:
#   Copy this file to /etc/nginx/nginx.conf (or include it) and adjust the
#   upstream address if the server is not on localhost:3100.
#
# SECURITY:
#   - Restricts allowed HTTP methods to GET, POST, OPTIONS (no PUT/DELETE).
#   - Enforces client_max_body_size to prevent oversized request attacks.
#   - Sets proxy timeouts to prevent slow-loris and hung-connection attacks.
#   - Security headers are applied globally via an include snippet so nested
#     location blocks (e.g. /assets/) inherit them automatically.
#   - CORS origin is read from the OPENCRED_CORS_ORIGIN env var at container
#     start — never hardcoded.
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # ── Request body size limit (#143) ───────────────────────────────────────
    # Prevents large-payload attacks. 10 MB covers batch CSV uploads (the
    # largest expected payload). Requests exceeding this return 413.
    client_max_body_size 10m;

    # ── Security headers snippet ─────────────────────────────────────────────
    # Defined here as a map-free block. Every `location` that needs security
    # headers uses `include /etc/nginx/snippets/security-headers.conf;` so
    # that nested locations (e.g. /assets/) inherit them automatically (#147).
    # Nginx's add_header in a child location overrides ALL parent add_header
    # directives, so repeating via include is the correct pattern.

    # Hide nginx version from response headers and error pages.
    server_tokens off;

    upstream opencred {
        server server:3100;
    }

    server {
        listen 80;
        server_name _;

        # ── Method restriction (#144) ────────────────────────────────────────
        # Only GET, POST, and OPTIONS are used by OpenCred routes.
        # PUT and DELETE are not implemented — reject them early.
        if ($request_method !~ ^(GET|POST|OPTIONS|HEAD)$) {
            return 405;
        }

        # ── CORS preflight (#144, #159) ──────────────────────────────────────
        # CORS origin is injected via the OPENCRED_CORS_ORIGIN env var
        # (substituted by envsubst at container start in docker-compose).
        # Restrict Access-Control-Allow-Methods to the methods we actually use.

        # ── Proxy settings (#146) ────────────────────────────────────────────
        # Timeouts prevent slow-loris and hung-upstream scenarios.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         8 8k;

        # ── Main application ─────────────────────────────────────────────────
        location / {
            # Security headers (#147) — applied in every location block.
            include /etc/nginx/snippets/security-headers.conf;

            # CORS headers (#144, #159)
            # $OPENCRED_CORS_ORIGIN is replaced by envsubst at container start.
            add_header Access-Control-Allow-Origin "${OPENCRED_CORS_ORIGIN}" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age 86400 always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://opencred;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Static assets (if served via nginx) ─────────────────────────────
        # Demonstrates the #147 fix: security headers are inherited via the
        # include directive, so adding cache headers here does NOT drop them.
        location /assets/ {
            # Security headers (#147) — repeated via include so they are
            # NOT lost when we add caching headers below.
            include /etc/nginx/snippets/security-headers.conf;

            add_header Cache-Control "public, max-age=31536000, immutable";

            proxy_pass http://opencred;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health check (no auth required) ──────────────────────────────────
        location = /v1/health {
            include /etc/nginx/snippets/security-headers.conf;

            proxy_pass http://opencred;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
