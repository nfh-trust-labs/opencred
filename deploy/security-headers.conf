# ==============================================================================
# OpenCred — Nginx Security Headers Snippet
# ==============================================================================
# Include this file in every `location` block so that security headers are
# never lost due to nginx's add_header inheritance rules (#147).
#
# In nginx, any `add_header` directive in a child location block overrides ALL
# `add_header` directives from the parent. By extracting security headers into
# a shared snippet and `include`-ing it in each location, every block gets the
# full set regardless of what other headers it adds.
# ==============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
