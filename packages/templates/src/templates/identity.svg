<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .header { fill: {{primaryColor}}; }
      .accent-stripe { fill: {{accentColor}}; }
      .title { font: bold 24px sans-serif; fill: #ffffff; }
      .label { font: 12px sans-serif; fill: #666666; }
      .value { font: 16px sans-serif; fill: #333333; }
      .footer { font: 10px sans-serif; fill: #999999; }
      .border { fill: none; stroke: {{primaryColor}}; stroke-width: 2; }
      .icon { fill: #ffffff; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="560" rx="12" />
  <rect class="border" x="1" y="1" width="798" height="558" rx="12" />

  <!-- Header bar -->
  <rect class="header" width="800" height="80" rx="12" />
  <rect class="header" y="12" width="800" height="68" />
  <!-- Accent stripe under header — issuer brand colour -->
  <rect class="accent-stripe" y="80" width="800" height="6" />

  <!-- ID card icon -->
  <g class="icon" transform="translate(20, 18)">
    <rect x="2" y="6" width="40" height="28" rx="4" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="16" cy="18" r="5" />
    <path d="M8,30 Q16,24 24,30" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="28" y1="14" x2="38" y2="14" stroke="#ffffff" stroke-width="2" />
    <line x1="28" y1="20" x2="38" y2="20" stroke="#ffffff" stroke-width="2" />
    <line x1="28" y1="26" x2="38" y2="26" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Logo placeholder -->
  {{#logoDataUri}}
  <image x="20" y="15" width="50" height="50" href="{{logoDataUri}}" preserveAspectRatio="xMidYMid meet" />
  {{/logoDataUri}}

  <!-- Credential title -->
  <text class="title" x="80" y="50">{{credentialTitle}}</text>

  <!-- Issuer -->
  <text class="label" x="40" y="110">Issued by</text>
  <text class="value" x="40" y="130">{{issuerName}}</text>

  <!-- Subject name -->
  <text class="label" x="40" y="170">Full Name</text>
  <text class="value" x="40" y="190">{{subject.name}}</text>

  <!-- Date of Birth -->
  <text class="label" x="40" y="230">Date of Birth</text>
  <text class="value" x="40" y="250">{{subject.dateOfBirth}}</text>

  <!-- Nationality -->
  <text class="label" x="40" y="290">Nationality</text>
  <text class="value" x="40" y="310">{{subject.nationality}}</text>

  <!-- Document Number -->
  <text class="label" x="40" y="350">Document Number</text>
  <text class="value" x="40" y="370">{{subject.documentNumber}}</text>

  <!-- Dates -->
  <text class="label" x="40" y="430">Valid from</text>
  <text class="value" x="40" y="450">{{validFrom}}</text>

  {{#validUntil}}
  <text class="label" x="300" y="430">Valid until</text>
  <text class="value" x="300" y="450">{{validUntil}}</text>
  {{/validUntil}}

  <!-- QR code area -->
  {{#qrCode}}
  <image x="600" y="100" width="160" height="160" href="{{qrCode}}" />
  {{/qrCode}}

  <!-- Accent footer bar — issuer brand colour -->
  <rect class="accent-stripe" y="552" width="800" height="8" rx="0" />

  <!-- Footer -->
  <text class="footer" x="40" y="540">Verifiable Credential — powered by OpenCred</text>
</svg>
